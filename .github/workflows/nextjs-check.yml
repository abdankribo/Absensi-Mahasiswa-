name: Next.js Check

on:
  push:
    branches: [main, nextjs-cleanup]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high
      - run: npm run build
